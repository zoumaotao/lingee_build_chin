<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk MCP Apps 本地预览</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; color: #202126; background: #f5f6f8; }
    body { margin: 0; min-height: 100vh; background: #f5f6f8; }
    .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
    aside { height: 100vh; overflow: auto; padding: 18px 14px; border-right: 1px solid #e3e5e8; background: #fff; }
    header { margin: 0 4px 18px; }
    h1 { margin: 0; font-size: 17px; }
    header p { margin: 5px 0 0; color: #70737d; font-size: 12px; }
    section { margin-top: 18px; }
    h2 { display: flex; align-items: center; gap: 6px; margin: 0 5px 7px; color: #60636d; font-size: 12px; }
    h2 small { padding: 1px 6px; border-radius: 10px; background: #f0f1f5; }
    button { display: flex; align-items: center; justify-content: space-between; width: 100%; margin: 3px 0; padding: 8px 9px; border: 1px solid transparent; border-radius: 8px; color: #34363d; background: transparent; cursor: pointer; text-align: left; }
    button:hover { background: #f5f4ff; }
    button.active { border-color: #d8d4ff; color: #5146c7; background: #efedff; }
    .card-title { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .card-title > span { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    button code { margin-left: 8px; color: #8a8d97; font-size: 10px; }
    .priority { display: inline-flex; flex: 0 0 auto; min-width: 30px; height: 20px; align-items: center; justify-content: center; padding: 0 6px; border-radius: 6px; font-size: 10px; font-weight: 800; line-height: 1; }
    .priority-p0 { color: #9f1239; background: #ffe4e6; }
    .priority-p1 { color: #9a3412; background: #ffedd5; }
    .priority-p2 { color: #475569; background: #e2e8f0; }
    .legend { display: flex; flex-wrap: wrap; gap: 7px 10px; margin-top: 10px; }
    .legend > span { display: inline-flex; align-items: center; gap: 5px; color: #60636d; font-size: 11px; }
    .legend .priority { height: 18px; }
    main { min-width: 0; padding: 18px; background: #f5f6f8; }
    .toolbar { display: flex; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto 12px; }
    .toolbar strong { overflow: hidden; flex: 1; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    select, a { height: 36px; padding: 0 11px; border: 1px solid #e3e5e8; border-radius: 8px; color: #34363d; background: #fff; font: inherit; font-size: 12px; }
    a { display: inline-flex; align-items: center; text-decoration: none; }
    .stage { max-width: 720px; min-height: calc(100vh - 80px); margin: 0 auto; padding: 0; background: transparent; }
    iframe { display: block; width: 100%; min-height: 720px; border: 0; }
    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; }
      aside { height: auto; max-height: 42vh; border-right: 0; border-bottom: 1px solid #e1e3e8; }
      main { padding: 10px; }
      .stage { min-height: 500px; padding: 8px; }
      iframe { min-height: 620px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <header><h1>HelpDesk MCP Apps</h1><p>6 张独立原子卡 · 本地快速预览</p><div class="legend" aria-label="优先级说明"><span title="当前上线闭环所需"><b class="priority priority-p0">P0</b>核心闭环</span></div></header>
      <section><h2>员工服务<small>4</small></h2><button type="button" data-card="employee/resolution" data-name="HelpDesk解决方案确认卡" data-priority="P0" data-priority-label="核心闭环"><span class="card-title"><b class="priority priority-p0">P0</b><span>HelpDesk解决方案确认卡</span></span><code>resolution</code></button>
<button type="button" data-card="employee/ticket-draft" data-name="HelpDesk工单确认卡" data-priority="P0" data-priority-label="核心闭环"><span class="card-title"><b class="priority priority-p0">P0</b><span>HelpDesk工单确认卡</span></span><code>ticket-draft</code></button>
<button type="button" data-card="employee/ticket-list" data-name="HelpDesk我的工单列表卡" data-priority="P0" data-priority-label="核心闭环"><span class="card-title"><b class="priority priority-p0">P0</b><span>HelpDesk我的工单列表卡</span></span><code>ticket-list</code></button>
<button type="button" data-card="employee/ticket-detail" data-name="HelpDesk员工工单进度卡" data-priority="P0" data-priority-label="核心闭环"><span class="card-title"><b class="priority priority-p0">P0</b><span>HelpDesk员工工单进度卡</span></span><code>ticket-detail</code></button></section>
<section><h2>处理人<small>2</small></h2><button type="button" data-card="agent/queue" data-name="HelpDesk处理人工单列表" data-priority="P0" data-priority-label="核心闭环"><span class="card-title"><b class="priority priority-p0">P0</b><span>HelpDesk处理人工单列表</span></span><code>queue</code></button>
<button type="button" data-card="agent/ticket-detail" data-name="HelpDesk处理人工单详情卡" data-priority="P0" data-priority-label="核心闭环"><span class="card-title"><b class="priority priority-p0">P0</b><span>HelpDesk处理人工单详情卡</span></span><code>ticket-detail</code></button></section>
<section><h2>经理运营<small>0</small></h2></section>
<section><h2>审批<small>0</small></h2></section>
<section><h2>知识沉淀<small>0</small></h2></section>
    </aside>
    <main>
      <div class="toolbar">
        <strong id="title">卡片预览</strong>
        <select id="locale" aria-label="界面语言"><option value="zh-CN">中文</option><option value="en-US">English</option></select>
        <a id="open" target="_blank" rel="noreferrer">新窗口打开</a>
      </div>
      <div class="stage"><iframe id="frame" title="MCP App 卡片预览"></iframe></div>
    </main>
  </div>
  <script>
    const buttons = Array.from(document.querySelectorAll("[data-card]"));
    const frame = document.getElementById("frame");
    const title = document.getElementById("title");
    const locale = document.getElementById("locale");
    const open = document.getElementById("open");
    const params = new URLSearchParams(location.search);
    let selected = params.get("card") || "employee/ticket-draft";
    if (!buttons.some((button) => button.dataset.card === selected)) selected = buttons[0].dataset.card;
    locale.value = params.get("locale") === "en-US" ? "en-US" : "zh-CN";

    function render(updateUrl = true) {
      const active = buttons.find((button) => button.dataset.card === selected);
      const source = "./" + selected + "/dist/index.html?preview=1&locale=" + encodeURIComponent(locale.value);
      buttons.forEach((button) => button.classList.toggle("active", button === active));
      title.textContent = active ? "[" + active.dataset.priority + " · " + active.dataset.priorityLabel + "] " + active.dataset.name + " · " + selected : selected;
      frame.src = source;
      open.href = source;
      if (updateUrl) {
        const next = new URLSearchParams(location.search);
        next.set("card", selected);
        next.set("locale", locale.value);
        history.replaceState(null, "", "?" + next.toString());
      }
    }

    buttons.forEach((button) => button.addEventListener("click", () => { selected = button.dataset.card; render(); }));
    locale.addEventListener("change", () => render());
    render(false);
  </script>
</body>
</html>
